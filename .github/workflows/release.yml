name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        if: runner.os == 'Linux'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "v$version" = "$GITHUB_REF_NAME"
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      NAME: crossmatrix-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/$NAME"
          cp LICENSE README.md "dist/$NAME/"
          bin="target/${{ matrix.target }}/release/crossmatrix"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$bin.exe" "dist/$NAME/"
            pwsh -NoProfile -Command "Compress-Archive -Path 'dist/$NAME' -DestinationPath 'dist/$NAME.zip'"
          else
            cp "$bin" "dist/$NAME/"
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
